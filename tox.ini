[tox]
envlist = py3
skipsdist = True

[testenv]
description = Build and install both support/* packages as wheels, then run pytest.
deps =
    pytest
    pytest-cov
    {toxinidir}/support/rts_prebuilder_project
    {toxinidir}/support/bb_runtimes_targets_gen
commands =
    pytest --junit-xml=pytest-report.xml \
        --cov=rts_prebuilder --cov=bb_runtimes_targets_gen \
        --cov-report=term --cov-report=xml:coverage.xml \
        {toxinidir}/tests/packaging {posargs}

[testenv:runtimes]
description = Generate the runtimes of every target. Kept out of envlist: it
    needs runtime sources a plain tox run cannot count on.
deps =
    -e{toxinidir}/support/rts_prebuilder_project
    -e{toxinidir}/support/bb_runtimes_targets_gen
changedir = {toxinidir}
commands =
    python -m bb_runtimes_targets_gen.targets --all \
        --output-dir {toxinidir}/generated --overwrite \
        --source-search-path {toxinidir}/src {posargs}
