[tox]
envlist = py3
skipsdist = True

[testenv]
description = Build and install both support/* packages as wheels, then run pytest.
deps =
    pytest
    pytest-cov
    {toxinidir}/support/rts_prebuilder_project
    {toxinidir}/support/bb_runtimes_targets_gen
commands =
    pytest --junit-xml=pytest-report.xml \
        --cov=rts_prebuilder --cov=bb_runtimes_targets_gen \
        --cov-report=term --cov-report=xml:coverage.xml \
        {toxinidir}/tests/packaging {posargs}
