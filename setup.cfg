# Setup configuration for the project
# We use this instead of pyproject.toml to be able to share between
# all projects

# Flake8 configuration
[flake8]
max-line-length = 110
# We ignore the following rules:
# - For black compatibility, E203 and W503
# - ANN101 ANN102 : We don't need typing annotations for self and cls (too verbose with no benefit)
extend-ignore = E203, W503, ANN101, ANN102

[mypy]
# Enable strict mode by default, only relax specific rules
strict = true
pretty = true

# Do not test examples
# For unknown reasons this doesn't work for pre-commit mypy, so
# add the exclude also in the pre-commit config yaml
exclude = ^(^examples/)

# Stricter that strict flags
enable_error_code = explicit-override

# Tell mypy explicitly where to find our packages
# Otherwise you need to have them installed in your venv (pip install -e .)
# to eliminate mypy import errors.
explicit_package_bases = true
mypy_path = support/rts_prebuilder_project:support/bb_runtimes_targets_gen:.

[mypy-bb_runtimes_targets_gen.targets.*]
# Less strict checks for the target configs
disallow_untyped_defs = false
disallow_untyped_calls = false
check_untyped_defs = false
disable_error_code = explicit-override

[mypy-bb_runtimes_targets_gen.concrete_infrastructure.*]
# Less strict checks for the infrastructure modules
disallow_untyped_defs = false
disallow_untyped_calls = false
check_untyped_defs = false
disable_error_code = explicit-override

[mypy-tests.*]
# Less strict checks for test code to allow gradual typing
disallow_untyped_defs = false
disallow_untyped_calls = false
