repos:
  - repo: https://github.com/ambv/black
    rev: 25.1.0
    hooks:
    - id: black
      types_or: [file]
      files: \.py$
  - repo: git@ssh.gitlab.adacore-it.com:it/flake8.git
    rev: 7.3.0
    hooks:
      - id: flake8
        files: '^(?!examples/).*\.py$' # Exclude examples/ directory
        additional_dependencies:
          - flake8-bugbear
          - flake8-builtins
          - flake8-comprehensions
          - flake8_plugin_utils
          - flake8-rst-docstrings
          # - flake8-use-fstring # can't be pulled from CI: not mirrored by the
          #   AdaCore package registry yet
          # - flake8-docstrings # TODO Fix then enable
          # - flake8-print # TODO Fix then enable
        name: flake8-7.1.1
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        files: '^(?!examples/).*\.py$' # Exclude examples/ directory
